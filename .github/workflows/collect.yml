# 30분마다 수집 → 분석 → JSON 생성 → GitHub Pages 배포.
# 사전 준비(한 번만): 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 지정,
# (선택) Settings → Secrets and variables → Actions 에 NAVER_CLIENT_ID, NAVER_CLIENT_SECRET, DART_API_KEY 추가.
name: collect-and-deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"   # UTC 기준 매시 7분·37분 (GitHub 사정으로 지연될 수 있음)

concurrency:
  group: collect-and-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 수집 DB 는 저장소에 커밋하지 않고 Actions 캐시로 이어 쓴다(잃어버려도 다음 수집부터 다시 쌓임)
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: trend-db-${{ github.run_id }}
          restore-keys: trend-db-

      - name: 수집·분석
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m trendchecker run

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: trend-db-${{ github.run_id }}

      - name: 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs
          retention-days: 3
          if-no-files-found: ignore

      - name: 사이트 파일 모으기
        run: |
          mkdir -p _site
          cp -r site/. _site/
          touch _site/.nojekyll
          test -f _site/data/meta.json || echo "수집 결과가 없어 빈 화면 상태로 배포합니다"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
