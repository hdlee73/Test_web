# 수집 → 분석 → JSON 산출.
# 배포 보류 원칙에 따라 지금은 수동 실행(workflow_dispatch)만 켜 두었다.
# 정기 실행은 사용자가 명시적으로 지시하면 아래 schedule 주석을 해제한다.
name: collect

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/30 * * * *"   # 30분마다 (UTC 기준, GitHub 사정으로 지연될 수 있음)

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 수집 DB 는 저장소에 커밋하지 않고 Actions 캐시로 이어 쓴다(잃어버려도 다음 수집부터 다시 쌓임)
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: trend-db-${{ github.run_id }}
          restore-keys: trend-db-

      - run: python -m trendchecker run

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: trend-db-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-and-logs
          path: |
            site/data
            logs
          retention-days: 3
