# 상시감시용 위험 신호어 사전 (뉴스·공시·게시판 제목에서 찾는다)
#
# risk_categories: 분류 이름 → 신호어 목록. 공백·대소문자는 무시하고 부분 일치로 찾는다.
#   너무 흔한 말은 넣지 않는다(오탐이 늘어 신호가 묻힌다). 필요하면 이 파일만 고치면 된다.
# disclosure_types: 공시 제목(보고서명)에서 찾는 중요 공시 유형. 위에서부터 먼저 맞는 유형 하나로 분류한다.

