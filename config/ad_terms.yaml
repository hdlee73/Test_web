# 광고·홍보성 글 의심 판정(제목만 본다). 블로그에만 적용하며, 걸린 글은 지우지 않고 '광고 의심'으로 표시해
# 키워드 순위와 위험 신호 집계에서 뺀다(화면에서 '광고 의심 글 포함'을 눌러 확인할 수 있다).
# 단, 유사수신·리딩방 같은 '사기·유사수신' 신호어가 든 글은 광고처럼 보여도 그 자체가 감시 대상이라 집계에 남긴다.

apply_to: [blog]

# strong: 하나만 있어도 광고 의심
strong:
  - 무직자
  - 당일대출
  - 당일 대출
  - 즉시대출
  - 승인율
  - 무방문
  - 무서류
  - 한도조회
  - 한도 조회
  - 무료상담
  - 무료 상담
  - 상담받아
  - 상담 받아
  - 문의하세요
  - 카톡 문의
  - 카카오톡 문의
  - 협찬
  - 원고료
  - 제공받아
  - 광고 포함
  - 체험단
  - 신청방법
  - 신청 방법
  - 신청 대상 조건
  - 100% 승인
  - 바로 승인

# weak: 서로 다른 말이 2개 이상 있어야 광고 의심
weak:
  - 최저금리
  - 비교
  - 추천
  - 후기
  - 혜택
  - 이벤트
  - 총정리
  - 꿀팁
  - 조건
  - 가능한 곳
  - 한도
  - 쉽게
  - 간단히

# patterns: 정규식(제목에 하나라도 있으면 광고 의심)
patterns:
  - '0\d{1,2}[-.\s]?\d{3,4}[-.\s]?\d{4}'   # 전화번호
  - '(?i)(텔레그램|telegram|t\.me/|카톡\s?id|오픈채팅|open\.kakao)'

# 같은 제목(정규화 후)이 이 횟수 이상 올라오면 도배로 보고 광고 의심
repeat_title_min: 3
