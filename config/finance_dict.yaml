# 금융·금융회사 키워드 사전
#
# name      : 화면에 보이는 대표어
# category  : 분류 (화면 필터에 사용)
# aliases   : 그대로 나오면 대표어로 인정하는 표현 (공백 무시 비교)
# ambiguous : 다른 뜻으로도 흔히 쓰이는 표현. 같은 글에 다른 금융 표현이 있을 때만 인정
#
# 영문 별칭은 대소문자를 구분하지 않으며, 앞뒤가 영문/숫자이면 매칭하지 않는다(예: "KB" 는 "KBO" 에 매칭 안 됨).
# 새 키워드는 data/candidates.json(사전에 없는 금융 문맥 명사)을 보고 주기적으로 추가한다.

