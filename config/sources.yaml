# 수집 대상 게시판 설정
#
# 원칙
# - 목록 1페이지(또는 RSS)만 읽는다. 게시물 본문 페이지는 열지 않는다.
# - 실행 시마다 robots.txt 를 확인하고, 허용되지 않으면 그 게시판은 건너뛴다.
# - 403/429/챌린지 응답이 오면 자동으로 쉬고(backoff), 반복되면 비활성으로 표시한다.
# - 저장/공개하는 것은 제목, 원문 링크, 시각, 게시판 이름뿐이다. 작성자 정보는 저장하지 않는다.
#
# type
#   rss         : RSS 2.0 피드
#   link_regex  : 목록 HTML 에서 post_pattern 에 맞는 링크의 텍스트를 제목으로 사용
#
# post_pattern 의 첫 번째 그룹(또는 이름 그룹 id)이 게시물 고유번호가 된다.
# finance_board: true 이면 이 게시판의 모든 글을 금융글로 본다.
#
# verified: robots.txt 확인 결과 (2026-11-11, 이 문서 작성 시점)
#   allowed   : 대상 경로가 허용됨을 확인
#   unknown   : 확인하지 못함. 실행 시 robots 검사로 결정된다.
#   blocked   : 확인 시도 시 robots 차단으로 판단됨 → 기본 비활성

defaults:
  min_interval_sec: 6        # 같은 호스트에 대한 요청 간격(초)
  timeout_sec: 15
  backoff_hours: [1, 3, 6, 24]  # 연속 차단 시 쉬는 시간

sources:
  - id: clien_park
    site: 클리앙
    board: 모두의공원
    type: link_regex
    category: board
    url: https://www.clien.net/service/board/park
    post_pattern: '/service/board/park/(\d+)'
    link_template: https://www.clien.net/service/board/park/{id}
    finance_board: false
    enabled: true
    verified: allowed   # /service/board/ 허용, 쿼리스트링 URL 은 금지 → 목록은 쿼리 없이 요청

  - id: clien_stock
    site: 클리앙
    board: 주식한당
    type: link_regex
    category: board
    url: https://www.clien.net/service/board/cm_stock
    post_pattern: '/service/board/cm_stock/(\d+)'
    link_template: https://www.clien.net/service/board/cm_stock/{id}
    finance_board: true
    enabled: true
    verified: allowed

  - id: ppomppu_stock
    site: 뽐뿌
    board: 증권포럼
    type: rss
    category: board
    url: https://www.ppomppu.co.kr/rss.php?id=stock
    post_pattern: 'id=stock&no=(\d+)'
    link_template: https://www.ppomppu.co.kr/zboard/view.php?id=stock&no={id}
    finance_board: true
    enabled: true
    verified: allowed   # RSS 2.0 제공 확인

  - id: ppomppu_free
    site: 뽐뿌
    board: 자유게시판
    type: rss
    category: board
    url: https://www.ppomppu.co.kr/rss.php?id=freeboard
    post_pattern: 'id=freeboard&no=(\d+)'
    link_template: https://www.ppomppu.co.kr/zboard/view.php?id=freeboard&no={id}
    finance_board: false
    enabled: true
    verified: allowed

  - id: ppomppu_money
    site: 뽐뿌
    board: 재테크포럼
    type: rss
    category: board
    url: https://www.ppomppu.co.kr/rss.php?id=money
    post_pattern: 'id=money&no=(\d+)'
    link_template: https://www.ppomppu.co.kr/zboard/view.php?id=money&no={id}
    finance_board: true
    enabled: true
    verified: unknown   # 게시판 id 확인 필요

  - id: ruliweb_hotdeal
    site: 루리웹
    board: 핫딜·예판
    type: link_regex
    category: board
    url: https://bbs.ruliweb.com/market/board/1020
    post_pattern: '/market/board/1020/read/(\d+)'
    link_template: https://bbs.ruliweb.com/market/board/1020/read/{id}
    finance_board: false
    enabled: true
    verified: allowed

  - id: bobaedream_free
    site: 보배드림
    board: 자유게시판
    type: link_regex
    category: board
    url: https://www.bobaedream.co.kr/list?code=freeb
    post_pattern: 'view\?code=freeb&(?:amp;)?No=(\d+)'
    link_template: https://www.bobaedream.co.kr/view?code=freeb&No={id}
    finance_board: false
    enabled: true
    verified: allowed   # User-agent: * Allow: /

  - id: paxnet_pick
    site: 팍스넷
    board: 강추이종목
    type: link_regex
    category: board
    url: https://www.paxnet.co.kr/tbbs/list?tbbsType=L&id=N00820
    post_pattern: 'tbbs/view\?id=N\d+&(?:amp;)?seq=(\d+)'
    finance_board: true
    enabled: true
    verified: allowed   # Disallow: /my/ 만 존재

  - id: theqoo_square
    site: 더쿠
    board: 스퀘어
    type: link_regex
    category: board
    url: https://theqoo.net/square
    post_pattern: 'theqoo\.net/square/(\d+)|^/square/(\d+)'
    link_template: https://theqoo.net/square/{id}
    finance_board: false
    enabled: true
    verified: allowed   # robots 허용(Content-Signal: ai-train=no, use=reference). 봇 차단 응답 가능성 높음

  - id: instiz_pt
    site: 인스티즈
    board: 이슈
    type: link_regex
    category: board
    url: https://www.instiz.net/pt
    post_pattern: '/pt/(\d+)'
    link_template: https://www.instiz.net/pt/{id}
    finance_board: false
    enabled: true
    verified: allowed   # 와일드카드 그룹 없음(AI 학습 봇만 차단)

  - id: mlbpark_bullpen
    site: 엠엘비파크
    board: 불펜
    type: link_regex
    category: board
    url: https://mlbpark.donga.com/mp/b.php?b=bullpen
    post_pattern: 'b=bullpen&(?:amp;)?id=(\d+)'
    link_template: https://mlbpark.donga.com/mp/b.php?b=bullpen&id={id}&m=view
    finance_board: false
    enabled: false
    off_reason: "robots.txt 가 이 경로의 자동 수집을 금지. 공식 API·RSS 없음 → 제외"
    verified: unknown

  - id: dcinside_stock
    site: 디시인사이드
    board: 주식 갤러리
    type: link_regex
    category: board
    url: https://gall.dcinside.com/board/lists/?id=stock_new2
    post_pattern: 'id=stock_new2&(?:amp;)?no=(\d+)'
    link_template: https://gall.dcinside.com/board/view/?id=stock_new2&no={id}
    finance_board: true
    enabled: false
    off_reason: "robots.txt 가 이 경로의 자동 수집을 금지. 공식 API 없음 → 제외"
    verified: unknown   # www 는 허용, gall 서브도메인은 확인 시 차단 응답 → 실행 시 robots 로 결정

  - id: todayhumor_best
    site: 오늘의유머
    board: 베스트
    type: link_regex
    category: board
    url: https://www.todayhumor.co.kr/board/list.php?table=bestofbest
    post_pattern: 'table=bestofbest&(?:amp;)?no=(\d+)'
    link_template: https://www.todayhumor.co.kr/board/view.php?table=bestofbest&no={id}
    finance_board: false
    enabled: true
    verified: unknown

  # ── 네이버 검색 API (공식 API, 키 필요: 환경변수 NAVER_CLIENT_ID / NAVER_CLIENT_SECRET)
  # 질의어는 config/naver_queries.txt. 키가 없으면 status 가 no_key 로 표시되고 건너뛴다.
  - id: naver_blog
    site: 네이버
    board: 블로그
    type: naver_api
    category: blog
    queries_file: naver_blog_queries.txt
    url: https://openapi.naver.com/v1/search/blog.json
    endpoint: blog
    pages: 1
    finance_board: true
    enabled: false
    off_reason: "블로그 메뉴를 쓰지 않기로 해서 수집 중단(필요하면 enabled: true 로 되돌림)"
    verified: allowed

  - id: naver_cafe
    site: 네이버
    board: 카페글
    type: naver_api
    category: board
    url: https://openapi.naver.com/v1/search/cafearticle.json
    endpoint: cafearticle
    pages: 1
    finance_board: true
    enabled: false
    off_reason: "카페글은 열람 권한이 필요한 경우가 많아 감시 자료로 부적합 → 제외"
    verified: allowed

  # 아래는 robots.txt 확인 시 차단으로 판단되어 기본 비활성
  - id: fmkorea_stock
    site: 에펨코리아
    board: 주식
    type: link_regex
    category: board
    url: https://www.fmkorea.com/stock
    post_pattern: 'fmkorea\.com/(\d+)|^/(\d+)$'
    finance_board: true
    enabled: false
    off_reason: "robots.txt 가 자동 수집을 금지. 공식 API·RSS 없음 → 제외"
    verified: blocked

  - id: 82cook_free
    site: 82쿡
    board: 자유게시판
    type: link_regex
    category: board
    url: https://www.82cook.com/entiz/enti.php?bn=15
    post_pattern: 'bn=15&(?:amp;)?num=(\d+)'
    finance_board: false
    enabled: false
    off_reason: "robots.txt 가 자동 수집을 금지. 공식 API·RSS 없음 → 제외"
    verified: blocked

  - id: slrclub_free
    site: SLR클럽
    board: 자유게시판
    type: link_regex
    category: board
    url: https://www.slrclub.com/bbs/zboard.php?id=free
    post_pattern: 'id=free&(?:amp;)?no=(\d+)'
    finance_board: false
    enabled: false
    off_reason: "robots.txt 가 자동 수집을 금지. 공식 API·RSS 없음 → 제외"
    verified: blocked

  - id: ddanzi_free
    site: 딴지일보
    board: 자유게시판
    type: link_regex
    category: board
    url: https://www.ddanzi.com/free
    post_pattern: 'ddanzi\.com/free/(\d+)|^/free/(\d+)'
    finance_board: false
    enabled: false
    off_reason: "robots.txt 가 자동 수집을 금지. 공식 API·RSS 없음 → 제외"
    verified: blocked

  # ── 뉴스: 네이버 뉴스 검색 API(공식). 질의어는 config/naver_news_queries.txt
  - id: naver_news
    site: 네이버
    board: 뉴스
    type: naver_api
    category: news
    url: https://openapi.naver.com/v1/search/news.json
    endpoint: news
    queries_file: naver_news_queries.txt
    pages: 1
    finance_board: true
    enabled: true
    verified: allowed

  # ── 공시: DART 오픈API(금융감독원, 키 필요: 환경변수 DART_API_KEY). 키 발급: https://opendart.fss.or.kr
  - id: dart_disclosure
    site: DART
    board: 전자공시
    type: dart_api
    category: disclosure
    url: https://opendart.fss.or.kr/api/list.json
    finance_board: true
    enabled: true
    verified: allowed

  # ── 공시: 한국거래소 KIND '오늘의 공시' RSS (거래소 고유 공시: 시장조치·투자경고·공매도 과열 등 포함)
  # DART 와 같은 공시는 dup_of 로 한쪽만 센다(DART 를 우선). 실행 시 robots.txt 를 확인하고 허용되지 않으면 건너뛴다.
  - id: kind_disclosure
    site: 한국거래소
    board: KIND 공시
    type: rss
    category: disclosure
    url: https://kind.krx.co.kr/disclosure/rsstodaydistribute.do?method=searchRssTodayDistribute&repIsuSrtCd=&mktTpCd=0&searchCorpName=&currentPageSize=100
    post_pattern: '(?i)acptno=(\d+)|(\d{14})'
    dup_of: dart_disclosure
    finance_board: true
    enabled: true
    verified: unknown   # 이 환경에서 접속 확인 불가 → 첫 실행 결과(수집 현황)로 확인

  # ── 증권신고서 제출 현황(자금조달): DART 오픈API, 펀드(집합투자증권) 제외. 별도 표(funding.json)로 저장하고 게시물 목록에는 넣지 않는다.
  - id: dart_funding
    site: DART
    board: 증권신고서(자금조달)
    type: dart_funding
    category: disclosure
    url: https://opendart.fss.or.kr/api/list.json
    finance_board: false
    enabled: true
    verified: allowed
