# 관심 키워드 (서버 측 매칭용)
# keyword  : 대표어
# synonyms : 하나라도 제목에 있으면 매칭 (공백 무시)
# exclude  : 하나라도 있으면 제외
# sources  : 비우면 전체, 아니면 sources.yaml 의 id 목록
watchlist:
  - keyword: 파킹통장
    synonyms: [파킹 통장, 파킹적금]
    exclude: [주차]
    sources: []
  - keyword: 스트레스DSR
    synonyms: [스트레스 DSR, DSR 3단계]
    exclude: []
    sources: []
